<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Karla:ital,wght@0,200..800;1,200..800&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order-Summary-Component</title>
  </head>
  <body>
    <div class="main_container">
      <div class="background_container"></div>

      <div class="main_card">
        <div class="img_div"></div>
        <div class="info_div">
          <div class="content_div">
            <h1>Order Summary</h1>
            <p class="info_para">
              You can now listen to millions of songs, audiobooks, and podcasts
              on any device anywhere you like!
            </p>

            <div class="annual_plan">
              <div class="music_icon"></div>
              <div class="amt">
                <p class="annual">Annual Plan</p>
                <p class="amt_yr">$59.99/year</p>
              </div>
              <div class="change">
                <a>Change</a>
              </div>
            </div>
            <button class="proceed">Proceed to Payment</button>
            <button class="cancle">Cancle Order</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
